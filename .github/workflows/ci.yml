name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Import check
        run: python -c "from jobbot_enterprise.main import create_app, Settings; create_app(Settings(db_path=':memory:')); print('ok')"
      - name: CLI lists built-in plugins
        run: jobbot-enterprise --list-plugins | python -c "import json,sys; n={p['name'] for p in json.load(sys.stdin)['plugins']}; assert {'greenhouse','lever','bm25','tfidf','slack','webhook','csv','jsonl'} <= n, n; print(sorted(n))"
      - name: Tests
        run: python -m pytest -q tests
      - name: Apache-2.0 license headers
        run: |
          grep -q "Apache License" LICENSE && grep -q "Version 2.0" LICENSE
          for f in $(git ls-files '*.py' '*.js' '*.yml' '*.yaml' '*.toml' 'Dockerfile'); do
            head -3 "$f" | grep -q "SPDX-License-Identifier: Apache-2.0" || { echo "missing Apache-2.0 header: $f"; exit 1; }
          done
          ! git grep -niE 'proprietary|confidential|all rights reserved' -- . ':!LICENSE' ':!.github/workflows/ci.yml' || \
            (echo "Leftover restrictive license wording" && exit 1)
      - name: Build sdist and wheel
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import jobbot_enterprise, pathlib; assert (pathlib.Path(jobbot_enterprise.__file__).parent/'static'/'widget.js').exists(); print(jobbot_enterprise.__version__)"
      - name: Secret hygiene
        run: |
          ! git grep -nE 'sk_live[_]|whsec_[A-Za-z0-9_-]{30,}|BEGIN (RSA|EC|OPENSSH) PRIVATE[ ]KEY|ghp_[A-Za-z0-9]{20,}' || \
            (echo "Possible secret material found" && exit 1)
      - name: Docker build
        run: docker build -t jobbot-enterprise:ci .
