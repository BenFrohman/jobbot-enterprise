[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbot-enterprise"
version = "0.2.0"
description = "Open-source, self-hosted hiring engine: consent-first candidate intake, explainable matching, signed webhooks, audit log and plugins."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Frohman, Benjamin Stanley", email = "frohmanbenjamin@gmail.com" }]
keywords = ["hiring", "recruiting", "ats", "fastapi", "self-hosted", "matching", "plugins"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "build>=1"]

[project.scripts]
jobbot-enterprise = "jobbot_enterprise.cli:main"

[project.urls]
Homepage = "https://github.com/BenFrohman/jobbot-enterprise"
Documentation = "https://github.com/BenFrohman/jobbot-enterprise/blob/main/docs/PLUGINS.md"
Changelog = "https://github.com/BenFrohman/jobbot-enterprise/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["jobbot_enterprise*"]

[tool.setuptools.package-data]
jobbot_enterprise = ["static/*.js"]
